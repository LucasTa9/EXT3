<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado Final - Quiz de Acessibilidade 2</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
   
   <header class="cabecalho-acessibilidade">
        <label for="filtro-daltonismo">Modo de Cor:</label>
        <select id="filtro-daltonismo" aria-label="Selecione um filtro de cores para daltonismo">
            <option value="padrao">Padrão</option>
            <option value="protanopia">Protanopia (Dificuldade com Vermelho)</option>
            <option value="deuteranopia">Deuteranopia (Dificuldade com Verde)</option>
            <option value="tritanopia">Tritanopia (Dificuldade com Azul)</option>
            <option value="alto-contraste">Alto Contraste</option>
        </select>
    </header>

    <main class="tela-inicial">
        <div class="TituloQuiz">
           <h1 class="TextoTitulo" style="margin-bottom: 1rem;">Seu<br>Resultado:</h1>
        </div>

        <div class="pergunta-texto">
            <h2 id="resultadoFinal">Calculando...</h2>
        </div>

        
        <div class="respostas-grid" style="grid-template-columns: 1fr; max-width: 400px; gap: 1rem;">
            
          
            <button class="btn-resposta cor-laranja-claro btn-acao" data-acao="iniciar" data-proxima="quiz_pergunta_1.html">
                Tentar De Novo
            </button>
            
            
            <button class="btn-resposta cor-verde" data-proxima="index.html">
                Voltar ao Início
            </button>
            
        </div>
    </main>

    <footer></footer>

   
    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>
    
    <script src="js/quiz.js"></script>
</body>
</html>
